stages:
  - build
  - test

variables:
  ANDROID_HOME: "/Users/kaahuz/Library/Android/sdk"
  ANDROID_SDK_ROOT: "/Users/kaahuz/Library/Android/sdk"

before_script:
  - chmod +x ./gradlew
  - export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH"

build:
  stage: build
  script:
    - ./gradlew assembleDebug

test:
  stage: test
  script:
    - ./gradlew testt